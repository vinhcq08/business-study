<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>Start a Business</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: editorial masthead, then one screen at a time (setup, settings, briefing, play, result).
   Base styles from the first, flat version of the game; world/src/town.css restyles them. */
:root{
  --paper:#F2EDE3; --sheet:#FBF8F2; --wash:#EAE3D6; --ink:#23201A; --muted:#6B6355; --rule:#D6CCBA; --edge:#B3A893; --focus:#23201A;
  --accent:#2F5D3A; --accent-wash:#E2E8DA; --good:#3E6B34; --bad:#9B3A2A; --bad-wash:#F3E1DA; --on-accent:#FBF8F2;
  --cafe:#A6532E; --saas:#2E6A63; --shop:#87661C; --agency:#6A4A62;
  --f-display:"Newsreader", "Iowan Old Style", Georgia, serif;
  --f-body:"Work Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#1A1712; --sheet:#221E18; --wash:#2B261E; --ink:#EDE6D8; --muted:#A89F8E; --rule:#3A342B; --edge:#5A5244; --focus:#EDE6D8;
  --accent:#9CC59F; --accent-wash:#26301F; --good:#A8C487; --bad:#E38C78; --bad-wash:#3A231C; --on-accent:#1A1712;
  --cafe:#E39A72; --saas:#86C2B8; --shop:#D9B866; --agency:#C6A2BC;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#1A1712; --sheet:#221E18; --wash:#2B261E; --ink:#EDE6D8; --muted:#A89F8E; --rule:#3A342B; --edge:#5A5244; --focus:#EDE6D8;
  --accent:#9CC59F; --accent-wash:#26301F; --good:#A8C487; --bad:#E38C78; --bad-wash:#3A231C; --on-accent:#1A1712;
  --cafe:#E39A72; --saas:#86C2B8; --shop:#D9B866; --agency:#C6A2BC;
  color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:400 15px/1.6 var(--f-body)}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:30px}
h1,h2,h3{margin:0;text-wrap:balance}
h1,h2{font-family:var(--f-display);font-weight:500;letter-spacing:-.015em}
h2{font-size:clamp(26px,3vw,34px);line-height:1.12}
h3{font:500 11px/1.3 var(--f-mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
p{margin:0}
a{color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

header.mast{display:flex;flex-direction:column;gap:14px;border-top:4px solid var(--ink);padding-top:12px}
.dateline{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 18px;font:500 11.5px/1.4 var(--f-mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding-bottom:12px;border-bottom:1px solid var(--rule)}
.dateline a{color:var(--muted)}
.mast-title{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.mast h1{font-size:clamp(56px,10vw,120px);line-height:.9;letter-spacing:-.04em;font-weight:500}
.mast h1 em{font-style:italic;font-weight:400;color:var(--accent)}
.mast .tag{max-width:46ch;font:400 clamp(17px,1.6vw,20px)/1.45 var(--f-display)}
.nav{display:flex;flex-wrap:wrap;gap:8px}

.btn{font:500 11.5px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink);background:transparent;border:1px solid var(--ink);border-radius:2px;padding:13px 16px;cursor:pointer;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--wash)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.section-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;border-bottom:1px solid var(--ink);padding-bottom:8px}
.kicker{font:500 11px/1.3 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lede{font:400 19px/1.5 var(--f-display);max-width:62ch}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Setup */
.grid-biz{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.biz{--c:var(--ink);text-align:left;background:var(--sheet);border:1px solid var(--rule);border-top:4px solid var(--c);border-radius:2px;padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;color:var(--ink);font:inherit;min-height:44px}
.biz:hover:not([disabled]){border-color:var(--ink);border-top-color:var(--c)}
.biz[aria-pressed="true"]{outline:2px solid var(--c);outline-offset:2px}
.biz[disabled]{cursor:not-allowed;opacity:.6}
.biz b{font:500 24px/1.1 var(--f-display)}
.biz .soon{font:500 10.5px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.levels{display:flex;flex-direction:column;border-top:1px solid var(--ink)}
.lvl{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--rule)}
.lvl .num{font:500 30px/1 var(--f-display);color:var(--muted)}
.lvl.open .num{color:var(--ink)}
.lvl .t{font:500 20px/1.2 var(--f-display)}
.lvl .d{font-size:13.5px;color:var(--muted)}
.state{font:500 10.5px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:6px 8px;border:1px solid currentColor;border-radius:2px;white-space:nowrap}
.state.won{color:var(--good)} .state.locked{color:var(--muted)} .state.soon{color:var(--muted);border-style:dashed}
.setup-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
@media (min-width:960px){.setup-grid{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}}
.summary{background:var(--sheet);border:1px solid var(--rule);padding:18px;display:flex;flex-direction:column;gap:10px}
.summary dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.summary dt{color:var(--muted)} .summary dd{margin:0}

/* Settings */
.settings{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;max-width:860px}
.field{display:flex;flex-direction:column;gap:8px;padding-bottom:18px;border-bottom:1px solid var(--rule)}
.field > label, .field > .lab{font:500 19px/1.3 var(--f-display)}
.field .help{font-size:13.5px;color:var(--muted);max-width:70ch}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--ink);border-radius:2px;overflow:hidden;width:fit-content;max-width:100%}
.seg button{font:500 11.5px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:13px 14px;border:0;border-right:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;min-height:44px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.switch{display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-size:15px}
.switch input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.custom{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.custom[hidden]{display:none}
.sl{display:flex;flex-direction:column;gap:4px;font-size:14px}
.sl output{font:500 13px var(--f-mono)}
input[type=range]{width:100%;accent-color:var(--accent);min-height:28px}
input[type=number],input[type=text],select{font:500 14px var(--f-mono);color:var(--ink);background:var(--sheet);border:1px solid var(--edge);border-radius:2px;padding:10px 10px;min-height:44px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Briefing */
.brief{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
@media (min-width:960px){.brief{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}}
.goal{border:1px solid var(--ink);padding:16px 18px;background:var(--sheet);display:flex;flex-direction:column;gap:6px}
.goal b{font:500 22px/1.3 var(--f-display)}
.subj{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.subj div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
.subj .ok{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--good)}
.subj .no{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Play */
.play{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:start}
@media (min-width:1020px){.play{grid-template-columns:360px minmax(0,1fr)}}
.desk{background:var(--sheet);border:1px solid var(--rule);border-top:3px solid var(--c, var(--ink));padding:18px;display:flex;flex-direction:column;gap:16px}
@media (min-width:1020px){.desk{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 16px)}}
.dec{display:flex;flex-direction:column;gap:6px;padding-bottom:14px;border-bottom:1px solid var(--rule)}
.dec .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.dec label{font:500 17px/1.25 var(--f-display)}
.dec input[type=number]{width:120px;text-align:right}
.dec .help{font-size:12.5px;color:var(--muted)}
.hint{background:var(--accent-wash);padding:12px 14px;font-size:13.5px;border-radius:2px}
.hint b{font-weight:600}
.board{display:flex;flex-direction:column;gap:22px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
.stats div{display:flex;flex-direction:column;gap:2px;padding:10px 12px 12px;border-left:1px solid var(--rule);min-width:0}
.stats div:first-child{border-left:0;padding-left:0}
.stats b{font:500 30px/1.05 var(--f-display);font-variant-numeric:lining-nums tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats span{font-size:12.5px;color:var(--muted)}
.stats .neg{color:var(--bad)}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stats div:nth-child(3){border-left:0;padding-left:0}.stats div:nth-child(n+3){border-top:1px solid var(--rule)}}
.goalbar{display:flex;flex-direction:column;gap:6px}
.goalbar .track{height:8px;background:var(--wash);border-radius:2px;overflow:hidden}
.goalbar .fill{height:100%;background:var(--accent)}
.chart{background:var(--sheet);border:1px solid var(--rule);padding:12px 12px 6px}
.chart svg{display:block;width:100%;height:auto}
.chart text{font:400 10.5px var(--f-mono);fill:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
@media (min-width:760px){.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
table.ledger{width:100%;border-collapse:collapse;font-size:14.5px}
.ledger td{padding:8px 0;border-bottom:1px solid var(--rule)}
.ledger td.v{text-align:right;font-family:var(--f-mono);font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:12px}
.ledger tr.cost td:first-child{padding-left:14px;color:var(--muted)}
.ledger tr.sub td{font-weight:600;border-top:1px solid var(--ink)}
.ledger tr.total td{font:600 17px var(--f-display);border-top:2px solid var(--ink);border-bottom:0}
.ledger tr.total td.v{font:600 15px var(--f-mono)}
.ledger .neg{color:var(--bad)}
.metrics{display:flex;flex-direction:column;border-top:1px solid var(--ink)}
.metrics div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px}
.metrics b{font:500 13.5px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{background:var(--sheet);border:1px solid var(--rule);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card b{font:500 19px/1.25 var(--f-display)}
.card p{font-size:14px}
.card .f{font:400 12.5px/1.5 var(--f-mono);background:var(--wash);padding:8px 10px;border-radius:2px;overflow-wrap:anywhere}
.card a{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.empty{border:1px dashed var(--edge);padding:22px;color:var(--muted);font:400 17px/1.5 var(--f-display)}

/* Result */
.result{display:flex;flex-direction:column;gap:20px;max-width:900px}
.verdict{font:500 clamp(40px,7vw,80px)/.95 var(--f-display);letter-spacing:-.03em}
.verdict.won{color:var(--good)} .verdict.lost{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;font:500 12px var(--f-mono);letter-spacing:.06em;border-radius:2px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px)}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
/* v2-3 additions: event and offer cards, statement tabs, voices, news */
.evt{border:1px solid var(--ink);background:var(--paper);padding:14px;display:flex;flex-direction:column;gap:10px}
.evt .tag{font:500 10.5px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--bad)}
.evt.offer .tag{color:var(--accent)}
.evt b{font:500 20px/1.25 var(--f-display)}
.evt p{font-size:14px}
.evt .choices{display:flex;flex-direction:column;gap:6px}
.evt .choices button{flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:2px;text-align:left;text-transform:none;letter-spacing:0;font:500 13.5px/1.35 var(--f-body);padding:11px 12px}
.evt .choices small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
.group{font:500 10.5px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:4px}
.dec select{max-width:100%}
.dec .chk{display:flex;gap:10px;align-items:flex-start;font:500 16px/1.3 var(--f-display);cursor:pointer}
.dec .chk input{width:22px;height:22px;margin:0;accent-color:var(--accent);flex:none}
.tabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--ink);margin-bottom:6px}
.tabs button{font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:12px 12px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);cursor:pointer;min-height:44px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.ledger tr.head td{font:500 10.5px/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:14px;border-bottom:1px solid var(--rule)}
.voices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.voice{background:var(--sheet);border:1px solid var(--rule);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.voice q{font:italic 400 17px/1.35 var(--f-display);quotes:"\201C" "\201D"}
.voice span{font:500 10.5px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.news{border-left:0;display:flex;flex-direction:column;gap:6px;padding:12px 14px;background:var(--accent-wash);font-size:14px}
.news b{font:500 17px var(--f-display)}
.card .bm{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--rule);padding-top:6px}
.review{display:flex;flex-direction:column;border-top:1px solid var(--ink)}
.review div{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 14px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:15px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px 22px;max-width:900px}
.form label{display:flex;flex-direction:column;gap:6px;font:500 16px/1.3 var(--f-display)}
.form label span{font:400 12.5px/1.4 var(--f-body);color:var(--muted)}
.biz.idea{border-top-style:dashed}
/* ===== Start a Business: full-screen 3D world with an editorial HUD and side sheets ===== */
:root{ --sky:#8FD3FF; --hud:rgba(251,248,242,.94); }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --sky:#4F94CF; --hud:rgba(34,30,24,.94); } }
:root[data-theme="dark"]{ --sky:#4F94CF; --hud:rgba(34,30,24,.94); }
html,body{height:100%;overflow:hidden}
#app{position:fixed;inset:0;background:var(--sky)}
#c{display:block;width:100%;height:100%;touch-action:none;outline:none}
.hud{position:fixed;top:calc(env(safe-area-inset-top, 0px) + 10px);left:max(10px, env(safe-area-inset-left, 0px));right:max(10px, env(safe-area-inset-right, 0px));display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 10px;background:var(--hud);border:1px solid var(--rule);border-top:3px solid var(--ink);z-index:5}
.hud .brand{font:500 24px/1 var(--f-display);letter-spacing:-.02em;white-space:nowrap}
.hud .brand em{color:var(--accent)}
.hud-stats{display:flex;flex-wrap:wrap;gap:4px 16px;flex:1;min-width:0}
.hud-stats span{display:flex;flex-direction:column;font-size:11.5px;color:var(--muted);line-height:1.25}
.hud-stats b{font:500 17px/1.1 var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.hud-stats b.neg{color:var(--bad)}
.hud-stats .goalmini{min-width:140px}
.hud-stats .goalmini i{display:block;height:5px;background:var(--wash);margin-top:4px}
.hud-stats .goalmini i span{display:block;height:100%;background:var(--accent)}
.hud-btns{display:flex;gap:6px}
.hud-btns .btn{min-height:40px;padding:10px 12px}
.prompt{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom, 0px) + 26px);display:flex;align-items:center;gap:10px;z-index:5}
.prompt .btn{background:var(--ink);color:var(--paper);min-height:48px;padding:14px 18px;font-size:12.5px}
.prompt span{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--hud);padding:6px 8px}
.joy{position:fixed;left:calc(max(16px, env(safe-area-inset-left, 0px)) + 8px);bottom:calc(env(safe-area-inset-bottom, 0px) + 24px);width:120px;height:120px;border-radius:50%;background:rgba(35,32,26,.12);border:2px solid rgba(35,32,26,.25);z-index:5;touch-action:none;display:none}
.joy .knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--hud);border:2px solid var(--ink)}
@media (pointer: coarse){ .joy{display:block} .prompt span{display:none} .prompt{left:auto;right:max(16px, env(safe-area-inset-right, 0px));transform:none} }
.keys{position:fixed;left:max(10px, env(safe-area-inset-left, 0px));bottom:calc(env(safe-area-inset-bottom, 0px) + 10px);font:500 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:var(--hud);padding:6px 8px;z-index:4}
@media (pointer: coarse){ .keys{display:none} }
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--paper);border-left:1px solid var(--ink);z-index:8;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.18)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) 10px 18px;border-bottom:1px solid var(--ink);border-top:4px solid var(--c, var(--ink))}
.sheet-head h2{font-size:26px}
.sheet-head .kicker{display:block}
.sheet-close{min-width:44px;min-height:44px;font:400 24px/1 var(--f-body);background:transparent;border:1px solid var(--ink);color:var(--ink);cursor:pointer}
.sheet-body{overflow:auto;padding:16px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) 18px;display:flex;flex-direction:column;gap:16px}
@media (max-width:700px){ .sheet{top:auto;height:82%;width:100%;border-left:0;border-top:1px solid var(--ink)} }
.modal{position:fixed;inset:0;background:rgba(26,23,18,.45);z-index:10;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--paper);border:1px solid var(--ink);border-top:4px solid var(--ink);width:min(760px,100%);max-height:calc(100% - 32px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px}
.modal-box h1{font-size:clamp(44px,8vw,76px);line-height:.92;letter-spacing:-.035em;font-weight:500}
.modal-box h1 em{font-style:italic;font-weight:400;color:var(--accent)}
.fade{position:fixed;inset:0;background:#1A1712;opacity:0;pointer-events:none;transition:opacity .45s;z-index:9;display:flex;align-items:center;justify-content:center;color:#EDE6D8;font:italic 400 28px var(--f-display)}
.fade.on{opacity:.82}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.pick button{text-align:left;background:var(--sheet);border:1px solid var(--rule);border-top:4px solid var(--c);padding:12px;cursor:pointer;color:var(--ink);font:inherit;min-height:44px;display:flex;flex-direction:column;gap:4px}
.pick button b{font:500 19px/1.15 var(--f-display)}
.pick button span{font-size:12px;color:var(--muted)}
.pick button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.pick button[disabled]{opacity:.45;cursor:not-allowed}
.places{display:flex;flex-direction:column;border-top:1px solid var(--ink)}
.places button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;text-align:left;padding:12px 2px;border:0;border-bottom:1px solid var(--rule);background:transparent;color:var(--ink);cursor:pointer;font:inherit;min-height:44px}
.places button b{font:500 19px/1.2 var(--f-display)}
.places button span{font-size:13px;color:var(--muted);grid-column:1}
.places button em{font:500 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-style:normal;grid-row:1 / span 2;grid-column:2;align-self:center}
.headline{font:500 clamp(26px,4vw,34px)/1.1 var(--f-display);letter-spacing:-.02em;border-bottom:3px double var(--ink);padding-bottom:10px}
.subjlist{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.subjlist div{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 10px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
.subjlist .seg button{padding:9px 10px;min-height:38px;font-size:10.5px}
.sheet .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
.sheet .two{grid-template-columns:minmax(0,1fr)}
@media (max-width:640px){
  .hud{gap:6px 8px;padding:6px 8px}
  .hud .brand{display:none}
  .hud-stats{flex-wrap:nowrap;gap:12px;overflow:hidden}
  .hud-stats span{font-size:10px;white-space:nowrap}
  .hud-stats span:nth-child(3){display:none}
  .hud-stats b{font-size:15px}
  .hud-stats .goalmini{min-width:84px}
  .hud-btns .btn{padding:8px 9px;min-height:40px;font-size:10.5px}
}
.toast{bottom:calc(92px + env(safe-area-inset-bottom, 0px))}
.say{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom, 0px) + 84px);max-width:min(460px, calc(100% - 32px));background:var(--sheet);border:1px solid var(--ink);border-left:5px solid var(--accent);padding:12px 16px;display:flex;flex-direction:column;gap:4px;z-index:6;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.say q{font:italic 400 19px/1.35 var(--f-display)}
.say span{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.drophint{position:fixed;inset:12px;display:flex;align-items:center;justify-content:center;border:3px dashed var(--ink);background:color-mix(in srgb, var(--paper) 82%, transparent);z-index:30;pointer-events:none;text-align:center}
.drophint div{display:flex;flex-direction:column;gap:6px;padding:20px}
.drophint b{font:500 26px/1.2 var(--f-display)}
.drophint span{color:var(--muted);font-size:14px}
.nogl{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font:400 19px/1.5 var(--f-display);background:var(--paper);z-index:20}
/* ===== Direction D: toy-box GUI with simulator polish =====
   Chunky outlines and pressed shadows, rounded type, glossy gradient buttons, outlined white lettering,
   a side dock with count badges, dark currency counters, pop-up windows with coloured header bars.
   One bright look in both light and dark system themes (the 3D world is bright either way). */
:root, :root:not([data-theme="light"]), :root[data-theme="dark"]{
  --paper:#F4F7FB; --sheet:#FFFFFF; --wash:#EEF1F6; --ink:#1F2430; --muted:#5A6070; --rule:#D5DAE3; --edge:#B8BECB; --focus:#3A86FF;
  --accent:#20B25E; --accent-wash:#E6F8EE; --good:#1E9E55; --bad:#D8352A; --bad-wash:#FFE3DF; --on-accent:#FFFFFF;
  --cafe:#F4C430; --saas:#3A86FF; --shop:#E74C3C; --agency:#9B59B6;
  --f-display:"Fredoka", "Nunito", ui-rounded, system-ui, sans-serif;
  --f-body:"Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"Fredoka", "Nunito", ui-rounded, system-ui, sans-serif;
  --sky:#8FD3FF; --hud:rgba(31,36,48,.78);
  --sun1:#FFE27A; --sun2:#F0A80E; --blu1:#6FB2FF; --blu2:#2F6FE0; --grn1:#6EE6A0; --grn2:#20B25E;
  --red1:#FF8A7A; --red2:#D8352A; --pur1:#C58BE0; --pur2:#8645B0;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:light } }
body{background:var(--sky);color:var(--ink);font-family:var(--f-body)}
.ol{color:#FFFFFF;text-shadow:0 3px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink)}
.ol-sm{color:#FFFFFF;text-shadow:0 2px 0 var(--ink),1.5px 1.5px 0 var(--ink),-1.5px 1.5px 0 var(--ink),1.5px -1.5px 0 var(--ink),-1.5px -1.5px 0 var(--ink)}
.shine{position:relative;overflow:hidden;isolation:isolate}
.shine::before{content:"";position:absolute;left:8%;right:8%;top:4px;height:34%;border-radius:999px;background:rgba(255,255,255,.42);pointer-events:none;z-index:-1}

/* Buttons */
.btn{font:600 16px/1 var(--f-display);letter-spacing:0;text-transform:none;color:var(--ink);background:linear-gradient(#FFFFFF,#E3E8F0);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:11px 16px;min-height:46px;cursor:pointer;transition:transform .12s, box-shadow .12s;position:relative;overflow:hidden;isolation:isolate}
.btn::before{content:"";position:absolute;left:8%;right:8%;top:4px;height:34%;border-radius:999px;background:rgba(255,255,255,.5);pointer-events:none;z-index:-1}
.btn:hover{transform:translateY(-1px);background:linear-gradient(#FFFFFF,#EDF1F7)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:linear-gradient(var(--grn1),var(--grn2));color:#FFFFFF;font-size:18px;text-shadow:0 2px 0 var(--ink),1.5px 1.5px 0 var(--ink),-1.5px 1.5px 0 var(--ink),1.5px -1.5px 0 var(--ink),-1.5px -1.5px 0 var(--ink)}
.btn.primary:hover{background:linear-gradient(#7FF0AE,#25BF66)}
.btn.danger{background:linear-gradient(var(--red1),var(--red2));color:#FFFFFF;text-shadow:0 2px 0 var(--ink)}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
.btn:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

/* HUD: goal bar (top centre), money (top right), dock (left) */
.hud{display:none}
.d-top{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top, 0px) + 12px);display:flex;flex-direction:column;align-items:center;gap:4px;z-index:5;pointer-events:none;max-width:calc(100% - 340px)}
.d-top .line{font:700 20px/1.1 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.d-goal{display:flex;align-items:center}
.d-lvl{width:54px;height:54px;border-radius:50%;background:linear-gradient(var(--sun1),var(--sun2));border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:flex;align-items:center;justify-content:center;z-index:2;font:700 22px var(--f-display);flex:none}
.d-bar{width:min(400px, 40vw);height:34px;margin-left:-14px;border:3px solid var(--ink);border-radius:0 999px 999px 0;background:var(--hud);position:relative;overflow:hidden;box-shadow:0 4px 0 var(--ink)}
.d-bar i{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(-45deg,#4BE08A 0 14px,#2CC56C 14px 28px);transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.d-bar i::after{content:"";position:absolute;left:0;right:0;top:3px;height:8px;background:rgba(255,255,255,.35)}
.d-bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 16px var(--f-display);white-space:nowrap}
.d-money{position:fixed;right:max(16px, env(safe-area-inset-right, 0px));top:calc(env(safe-area-inset-top, 0px) + 14px);display:flex;flex-direction:column;align-items:flex-end;gap:10px;z-index:5}
.d-cash{display:flex;align-items:center;height:48px;min-width:190px;background:var(--hud);border:3px solid var(--ink);border-radius:999px;padding:0 20px 0 0;position:relative}
.d-coin{width:56px;height:56px;margin-left:-12px;border-radius:50%;background:linear-gradient(var(--sun1),var(--sun2));border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;flex:none;font:700 26px var(--f-display)}
.d-cash b{font:700 26px var(--f-display);margin-left:10px;font-variant-numeric:tabular-nums}
.d-cash.neg b{color:#FFB3A8}
.d-last{display:flex;align-items:center;gap:8px;height:40px;background:var(--hud);border:3px solid var(--ink);border-radius:999px;padding:0 16px 0 5px}
.d-last i{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font:700 16px var(--f-display);color:#FFFFFF;font-style:normal}
.d-last.up i{background:linear-gradient(var(--grn1),var(--grn2))}
.d-last.down i{background:linear-gradient(var(--red1),var(--red2))}
.d-last b{font:700 18px var(--f-display);white-space:nowrap}
.d-pop{position:absolute;right:10px;top:-6px;font:700 24px var(--f-display);pointer-events:none;animation:d-pop 1.3s ease-out forwards}
@keyframes d-pop{0%{opacity:0;transform:translateY(8px) scale(.7)}15%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-38px) scale(1)}}
.d-bump{animation:d-bump .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes d-bump{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.d-dock{position:fixed;left:max(14px, env(safe-area-inset-left, 0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;z-index:5}
.d-dock button{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:0;cursor:pointer;position:relative;color:inherit}
.d-dock .ic{width:66px;height:66px;border-radius:20px;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);display:flex;align-items:center;justify-content:center;transition:transform .15s cubic-bezier(.3,1.6,.5,1)}
.d-dock button:hover .ic{transform:scale(1.07) rotate(-2deg)}
.d-dock button:active .ic{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.d-dock .lb{font:700 14px var(--f-display)}
.d-dock .badge{position:absolute;top:-8px;right:-10px;min-width:26px;height:26px;border-radius:999px;background:linear-gradient(#FF5C5C,#D81E1E);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font:700 13px var(--f-display);color:#FFFFFF;padding:0 4px;animation:d-bump 1.6s ease-in-out infinite}
.d-dock .locked .ic{filter:grayscale(.8) brightness(.95)}
.ic.blu{background:linear-gradient(var(--blu1),var(--blu2))} .ic.red{background:linear-gradient(var(--red1),var(--red2))} .ic.grn{background:linear-gradient(var(--grn1),var(--grn2))}
.ic.sun{background:linear-gradient(var(--sun1),var(--sun2))} .ic.pur{background:linear-gradient(var(--pur1),var(--pur2))}
.ic svg{width:34px;height:34px}

/* Action prompt */
.prompt{bottom:calc(env(safe-area-inset-bottom, 0px) + 28px)}
.prompt .btn{background:linear-gradient(var(--sun1),var(--sun2));color:#FFFFFF;min-height:60px;padding:12px 28px 12px 12px;border-radius:20px;box-shadow:0 6px 0 var(--ink);font:700 26px var(--f-display);display:flex;align-items:center;gap:12px;text-shadow:0 3px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink);animation:d-in .35s cubic-bezier(.3,1.6,.5,1)}
.prompt .btn::after{content:"E";order:-1;width:38px;height:38px;border-radius:10px;background:#FFFFFF;border:3px solid var(--ink);color:var(--ink);text-shadow:none;font:700 20px var(--f-display);display:flex;align-items:center;justify-content:center}
.prompt span{display:none}
@media (pointer: coarse){ .prompt .btn::after{display:none} .prompt .btn{padding:12px 22px} }
@keyframes d-in{0%{opacity:0;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}
.keys{font:700 12px var(--f-display);letter-spacing:0;text-transform:none;background:rgba(255,255,255,.92);border:2px solid var(--ink);border-radius:12px;padding:6px 10px;bottom:calc(env(safe-area-inset-bottom, 0px) + 12px)}
.joy{background:rgba(31,36,48,.18);border:3px solid var(--ink)}
.joy .knob{background:linear-gradient(#FFFFFF,#DDE3EE);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}

/* Pop-up windows (side sheet becomes a floating window; the report opens wide in the middle) */
.sheet{top:calc(env(safe-area-inset-top, 0px) + 92px);right:max(16px, env(safe-area-inset-right, 0px));bottom:calc(env(safe-area-inset-bottom, 0px) + 20px);width:min(500px, calc(100% - 32px));background:var(--paper);border:4px solid var(--ink);border-radius:28px;box-shadow:0 9px 0 var(--ink);animation:d-win .32s cubic-bezier(.3,1.5,.5,1);overflow:visible}
.sheet[data-panel="news"], .sheet[data-panel="menu"], .sheet[data-panel="library"]{left:50%;right:auto;transform:translateX(-50%);width:min(980px, calc(100% - 32px));animation:d-win-c .32s cubic-bezier(.3,1.5,.5,1)}
@keyframes d-win{0%{opacity:0;transform:scale(.85) translateY(20px)}100%{opacity:1;transform:none}}
@keyframes d-win-c{0%{opacity:0;transform:translateX(-50%) scale(.85)}100%{opacity:1;transform:translateX(-50%)}}
.sheet-head{position:relative;border:0;border-bottom:4px solid var(--ink);border-radius:24px 24px 0 0;padding:12px 64px 12px 20px;background:linear-gradient(color-mix(in srgb, var(--c, var(--blu2)) 55%, #FFFFFF), var(--c, var(--blu2)));isolation:isolate}
.sheet-head::before{content:"";position:absolute;left:6%;right:6%;top:4px;height:30%;border-radius:999px;background:rgba(255,255,255,.4);z-index:-1}
.sheet-head h2{font:700 28px/1.1 var(--f-display);color:#FFFFFF;text-shadow:0 3px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink)}
.sheet-head .kicker{font:700 13px var(--f-display);letter-spacing:0;text-transform:none;color:#FFFFFF;text-shadow:0 2px 0 var(--ink),1px 1px 0 var(--ink),-1px 1px 0 var(--ink),1px -1px 0 var(--ink),-1px -1px 0 var(--ink)}
.sheet-close{position:absolute;top:-18px;right:-18px;width:52px;height:52px;min-width:0;min-height:0;border-radius:50%;border:3px solid var(--ink);background:linear-gradient(#FF6B6B,#D42A2A);box-shadow:0 4px 0 var(--ink);color:#FFFFFF;font:700 30px/1 var(--f-display);z-index:3;text-shadow:0 2px 0 var(--ink);transition:transform .15s}
.sheet-close:hover{transform:rotate(90deg) scale(1.06)}
.sheet-body{padding:18px 20px 22px;gap:14px}
.sheet .sheet-head{margin:0}
.sheet > .sheet-close{top:-18px}
@media (max-width:700px){ .sheet, .sheet[data-panel="news"], .sheet[data-panel="menu"], .sheet[data-panel="library"]{top:auto;left:8px;right:8px;bottom:8px;width:auto;transform:none;height:80%;animation:d-win .3s} .sheet-close{top:-14px;right:-6px} }

/* Content inside windows */
h3{font:700 17px var(--f-display);letter-spacing:0;text-transform:none;color:var(--ink)}
.small{font-size:13.5px}
.lede{font:700 18px/1.45 var(--f-body)}
.kicker{font:700 12px var(--f-display);letter-spacing:.02em;text-transform:none}
.dec{background:#FFFFFF;border:3px solid var(--ink);border-radius:18px;padding:12px 14px;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;gap:8px}
.dec label{font:800 15px var(--f-body)}
.dec .help{font:700 13px/1.4 var(--f-body);color:var(--muted)}
.dec input[type=number], .dec select{font:700 20px var(--f-display);border:3px solid var(--ink);border-radius:12px;background:#FFF4CC;color:var(--ink);padding:4px 8px;min-height:42px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:16px;border-radius:10px;background:#2B3140;border:3px solid var(--ink)}
input[type=range]::-moz-range-track{height:10px;border-radius:10px;background:#2B3140;border:3px solid var(--ink)}
input[type=range]::-moz-range-progress{height:10px;border-radius:10px;background:var(--sun2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-10px;border-radius:50%;background:linear-gradient(#FFFFFF,#DDE3EE);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:linear-gradient(#FFFFFF,#DDE3EE);border:3px solid var(--ink)}
.hint{background:#EAF4FF;border:3px solid var(--ink);border-radius:16px;padding:12px 14px;font:700 14px/1.45 var(--f-body)}
.goalbar{background:#FFFFFF;border:3px solid var(--ink);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.goalbar .track{height:16px;border:3px solid var(--ink);border-radius:999px;background:var(--hud);overflow:hidden}
.goalbar .fill{height:100%;background:repeating-linear-gradient(-45deg,#4BE08A 0 12px,#2CC56C 12px 24px)}
.news > div, .why .card, .voice, .evt, .metrics > div, .stats > div{background:#FFFFFF;border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink)}
.news{display:flex;flex-direction:column;gap:10px}
.news > div{padding:10px 12px;font:700 14px/1.4 var(--f-body)}
.headline{font:700 clamp(24px,3.4vw,32px)/1.15 var(--f-display);letter-spacing:0;border:3px solid var(--ink);border-radius:18px;padding:12px 16px;background:linear-gradient(#FFF3C4,#FFE27A);box-shadow:0 4px 0 var(--ink)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.metrics > div{padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.metrics span, .stats span{font:700 12.5px var(--f-body);color:var(--muted)}
.metrics b{font:700 21px var(--f-display)}
.stats{display:grid;gap:10px;border:0}
.stats > div{padding:12px 14px;display:flex;flex-direction:column-reverse;gap:2px}
.stats b{font:700 28px var(--f-display)}
.why{display:flex;flex-direction:column;gap:10px}
.why .card{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.why .card b{font:700 18px var(--f-display)}
.why .card .f{font:700 12.5px var(--f-body);background:var(--wash);border-radius:10px;padding:6px 8px;color:var(--ink)}
.why .card a{font:700 13px var(--f-display);color:var(--blu2)}
.voice{padding:10px 14px}
.voice q{font:700 16px/1.35 var(--f-body)}
.ledger, table{font-family:var(--f-body)}
.seg{border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:#FFFFFF}
.seg button{font:700 14px var(--f-display);letter-spacing:0;text-transform:none}
.seg button[aria-pressed="true"]{background:linear-gradient(var(--blu1),var(--blu2));color:#FFFFFF;text-shadow:0 2px 0 var(--ink)}
.places{border:0;gap:10px}
.places button{background:#FFFFFF;border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:10px 14px}
.places button b{font:700 19px var(--f-display)}
.places button em{font:700 13px var(--f-display);text-transform:none;letter-spacing:0;color:var(--blu2)}

/* Modals: start screen, events, results */
.modal{background:rgba(31,36,48,.55)}
.modal-box{background:var(--paper);border:4px solid var(--ink);border-radius:30px;box-shadow:0 10px 0 var(--ink);animation:d-win .32s cubic-bezier(.3,1.5,.5,1)}
.modal-box h1{font:700 clamp(40px,7vw,68px)/1 var(--f-display);letter-spacing:0;color:#FFFFFF;text-shadow:0 5px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink)}
.modal-box h1 em{font-style:normal;color:var(--sun1)}
.pick button{background:#FFFFFF;border:3px solid var(--ink);border-top-width:3px;border-radius:18px;box-shadow:0 4px 0 var(--ink);transition:transform .15s cubic-bezier(.3,1.6,.5,1)}
.pick button::before{content:"";display:block;height:10px;margin:-12px -12px 4px;border-radius:15px 15px 0 0;background:var(--c)}
.pick button:hover{transform:translateY(-2px) scale(1.02)}
.pick button b{font:700 19px var(--f-display)}
.pick button[aria-pressed="true"]{outline:none;background:#FFF4CC;box-shadow:0 4px 0 var(--ink), 0 0 0 4px var(--sun2)}
.evt{padding:16px;gap:12px}
.evt b{font:700 22px var(--f-display)}
.evt .tag{font:700 13px var(--f-display);letter-spacing:0;text-transform:none;color:#FFFFFF;background:linear-gradient(var(--pur1),var(--pur2));border:2px solid var(--ink);border-radius:999px;padding:4px 10px;align-self:flex-start}
.evt .choices button{background:#FFFFFF;border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);font:800 15px/1.35 var(--f-body)}

/* Messages */
.toast{background:var(--ink);color:#FFFFFF;border:3px solid #FFFFFF;border-radius:16px;font:700 15px var(--f-display);letter-spacing:0;padding:10px 16px;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.say{background:#FFFFFF;border:3px solid var(--ink);border-left-width:3px;border-radius:18px;box-shadow:0 5px 0 var(--ink);animation:d-in .3s cubic-bezier(.3,1.6,.5,1)}
.say q{font:700 19px/1.35 var(--f-display)}
.say span{font:700 13px var(--f-display);letter-spacing:0;text-transform:none;color:var(--muted)}
.fade{background:rgba(31,36,48,.9);font:700 34px var(--f-display);color:#FFFFFF;text-shadow:0 3px 0 #000}
.drophint{border-radius:28px;border-width:4px}
.drophint b{font:700 28px var(--f-display)}

@media (max-width:640px){
  .d-top{max-width:calc(100% - 200px)}
  .d-top .line{font-size:15px}
  .d-lvl{width:40px;height:40px;font-size:16px}
  .d-bar{height:28px;width:38vw}
  .d-bar span{font-size:12px}
  .d-cash{height:40px;min-width:0}
  .d-coin{width:44px;height:44px;font-size:20px}
  .d-cash b{font-size:19px}
  .d-last{display:none}
  .d-dock{top:calc(env(safe-area-inset-top, 0px) + 86px);transform:none;gap:8px}
  .d-dock .ic{width:48px;height:48px;border-radius:14px}
  .d-dock .ic svg{width:24px;height:24px}
  .d-dock .lb{font-size:11px}
}
.tabs{display:flex;flex-wrap:wrap;gap:8px;border:0}
.tabs button{font:700 15px var(--f-display);letter-spacing:0;text-transform:none;color:var(--ink);background:linear-gradient(#FFFFFF,#E3E8F0);border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);padding:8px 14px;cursor:pointer}
.tabs button[aria-selected="true"]{background:linear-gradient(var(--blu1),var(--blu2));color:#FFFFFF;text-shadow:0 2px 0 var(--ink),1px 1px 0 var(--ink),-1px 1px 0 var(--ink)}
.chart{background:#FFFFFF;border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink)}
.toast{z-index:12}
.sheet{top:calc(env(safe-area-inset-top, 0px) + 128px)}
@media (max-width:640px){ .d-top{left:max(12px, env(safe-area-inset-left, 0px));transform:none;align-items:flex-start;max-width:calc(100% - 170px)} .d-bar{width:34vw} .d-dock{top:calc(env(safe-area-inset-top, 0px) + 104px)} }
@media (prefers-reduced-motion: reduce){ *, *::before, *::after{animation:none!important;transition:none!important} }
/* Business School: lesson tiles and lesson cards */
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.lessons .ls{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:10px 12px;background:#FFFFFF;border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);color:var(--ink);font:inherit;cursor:pointer;min-height:64px}
.lessons .ls b{font:700 16px/1.2 var(--f-display)}
.lessons .ls span{font:800 11px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--blu2)}
.lessons .ls.new span{color:#D81E1E}
.lessons .ls:hover{transform:translateY(-1px)}
.lessons .ls:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.lessons .ls.locked{background:var(--wash);border-style:dashed;box-shadow:none;cursor:default;opacity:.7}
.lessons .ls.locked span{color:var(--muted)}
.lesson{background:#FFFFFF;border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.lesson .kick{font:800 11px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--blu2)}
.lesson h2{font:700 26px/1.15 var(--f-display);margin:0}
.lesson h3{margin:6px 0 0}
.lesson .f{font:800 14px/1.4 var(--f-body);background:var(--wash);border-radius:12px;padding:8px 10px}
.why .card .study, .review .study{align-self:flex-start;background:none;border:0;padding:0;font:700 13px var(--f-display);color:var(--blu2);cursor:pointer;text-decoration:underline}
#modalBox .lesson{margin-bottom:12px}

/* =========================================================
   Overhaul kit (approved mockups): windows sized to content, icons,
   tiles, chips, decision rows, the report, bank, investors, School,
   Places, the start screen, news cards, results and the Run dock.
   ========================================================= */
.sheet{bottom:auto;max-height:calc(100vh - 150px);max-height:calc(100dvh - 150px - env(safe-area-inset-top, 0px))}
.sheet-head{display:flex;align-items:center;justify-content:flex-start;gap:12px}
.sheet-head .kicker:empty{display:none}
.sh-ic{flex:none;display:flex}
.sheet[data-panel="desk"]{width:min(600px, calc(100% - 32px))}
.sheet[data-panel="station"]{width:min(540px, calc(100% - 32px))}
.sheet[data-panel="bank"], .sheet[data-panel="investor"], .sheet[data-panel="places"]{left:50%;right:auto;transform:translateX(-50%);width:min(900px, calc(100% - 32px));animation:d-win-c .32s cubic-bezier(.3,1.5,.5,1)}
.sheet[data-panel="places"]{width:min(680px, calc(100% - 32px))}
.sheet[data-panel="library"]{width:min(1180px, calc(100% - 32px))}
@media (max-width:700px){
  .sheet, .sheet[data-panel]{top:auto;left:8px;right:8px;bottom:8px;width:auto;transform:none;height:auto;max-height:86%;animation:d-win .3s}
}
.btn.big{font-size:21px;min-height:56px;border-radius:18px;padding:10px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.foot{position:sticky;bottom:-22px;margin:2px -20px -22px;padding:14px 20px 18px;background:linear-gradient(rgba(244,247,251,0), var(--paper) 28%);display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:2}
.foot .btn.big{flex:1 1 200px}
.foot-note{flex:1 1 240px;font:800 14px/1.35 var(--f-body);color:#3A4152}
.modal .foot, .offerbox .foot, .school-read .foot{position:static;margin:0;padding:0;background:none}

/* Icons */
.ico{width:44px;height:44px;border-radius:12px;border:3px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;flex:none;position:relative;overflow:hidden;isolation:isolate;box-sizing:border-box}
.ico::before{content:"";position:absolute;left:10%;right:10%;top:3px;height:30%;border-radius:999px;background:rgba(255,255,255,.42);z-index:-1}
.ico svg{width:62%;height:62%}
.ico b{font:700 22px var(--f-display)}
.ico.sun{background:linear-gradient(var(--sun1),var(--sun2))} .ico.grn{background:linear-gradient(var(--grn1),var(--grn2))} .ico.blu{background:linear-gradient(var(--blu1),var(--blu2))}
.ico.red{background:linear-gradient(var(--red1),var(--red2))} .ico.pur{background:linear-gradient(var(--pur1),var(--pur2))} .ico.ink{background:var(--ink)} .ico.ink::before{display:none}
.ico.sm{width:32px;height:32px;border-radius:50%} .ico.round{width:50px;height:50px;border-radius:50%} .ico.big{width:58px;height:58px;border-radius:16px}
.ico.huge{width:108px;height:108px;border-radius:28px;border-width:4px;box-shadow:0 6px 0 var(--ink)}

/* Tints, tiles, chips, notes */
.t-sun{background:#FFFBEB} .t-grn{background:#F2FBF5} .t-blu{background:#F2F8FF} .t-red{background:#FFF1EF} .t-pur{background:#FAF5FD}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.contents{display:contents}
.tile{background:#FFFFFF;border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:9px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile.t-blu{background:#EAF4FF} .tile.t-grn{background:#E8F9EF} .tile.t-red{background:#FFE3DF} .tile.t-sun{background:#FFF4CC} .tile.t-pur{background:#F4ECFA}
.tile span{font:800 12.5px var(--f-body);color:#4A5163}
.tile b{font:700 22px/1.1 var(--f-display);overflow-wrap:anywhere}
.tile small{font:800 12px var(--f-body);color:#4A5163}
.tiles.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.tiles.four .tile{background:#FFFFFF;padding:12px 14px}
.tiles.four .tile b{font-size:25px}
.tiles.four .tile[class*=" t-"]::before{content:"";width:30px;height:30px;border-radius:9px;border:3px solid var(--ink);margin-bottom:4px}
.tiles.four .t-grn::before{background:linear-gradient(var(--grn1),var(--grn2))} .tiles.four .t-red::before{background:linear-gradient(var(--red1),var(--red2))}
.tiles.four .t-blu::before{background:linear-gradient(var(--blu1),var(--blu2))} .tiles.four .t-sun::before{background:linear-gradient(var(--sun1),var(--sun2))}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;background:#FFFFFF;border:2px solid var(--ink);border-radius:999px;padding:3px 10px;font:800 13.5px/1.3 var(--f-body);color:var(--ink)}
.chip.t-sun{background:#FFF4CC} .chip.t-grn{background:#E8F9EF} .chip.t-pur{background:#F4ECFA} .chip.t-blu{background:#EAF4FF} .chip.t-red{background:#FFE3DF}
.note{display:flex;align-items:center;gap:10px;border:3px solid var(--ink);border-radius:16px;padding:10px 12px;font:800 15px/1.35 var(--f-body)}
.note.t-blu{background:#EAF4FF} .note.t-sun{background:#FFF8DC} .note.t-grn{background:#E8F9EF} .note.t-red{background:#FFE3DF} .note.t-pur{background:#F4ECFA}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.news > div{display:flex;flex-direction:column;gap:2px}
.news span{font:700 13.5px/1.35 var(--f-body)}
.study{align-self:flex-start;background:none;border:0;padding:0;font:700 14px var(--f-display);color:var(--blu2);cursor:pointer;text-decoration:underline}

/* Decision rows, steppers, switches and sliders */
.rows{display:flex;flex-direction:column;gap:10px}
.drow{display:flex;align-items:center;gap:12px;border:3px solid var(--ink);border-radius:16px;padding:8px 10px;color:var(--ink);font:inherit;text-align:left;width:100%;box-sizing:border-box}
.drow.multi{flex-wrap:wrap}
.drow .txt{flex:1;min-width:120px;display:flex;flex-direction:column;gap:1px}
.txt b{font:700 17px/1.15 var(--f-display)}
.txt small{font:800 12.5px/1.3 var(--f-body);color:#4A5163}
.drow.dash{border-style:dashed;background:#F7F9FC;cursor:pointer}
.drow em{font:700 15px var(--f-display);font-style:normal;color:var(--blu2)}
.drow.bare{border:0;padding:0;background:none}
label.drow{cursor:pointer}
.stepper{display:flex;align-items:center;gap:6px;flex:none}
.step{width:40px;height:40px;border-radius:12px;background:#FFFFFF;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);font:700 22px/1 var(--f-display);color:var(--ink);cursor:pointer;padding:0}
.step:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.pill{display:inline-flex;align-items:center;background:#FFF4CC;border:3px solid var(--ink);border-radius:12px;padding:0 6px;height:40px;box-sizing:border-box}
.pill i{font:700 20px var(--f-display);font-style:normal}
.pill input{width:70px;border:0;background:transparent;font:700 21px var(--f-display);color:var(--ink);text-align:center;-moz-appearance:textfield;appearance:textfield;padding:0;min-height:0}
.pill input::-webkit-inner-spin-button, .pill input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.drow .seg{display:flex;flex-wrap:nowrap;width:auto}
.drow .seg button{padding:8px 10px;min-height:40px;font:700 15px/1.1 var(--f-display);border-right:3px solid var(--ink)}
.drow .seg button:last-child{border-right:0}
.seg button small{display:block;font:800 10.5px var(--f-body);opacity:.85}
.drow select{font:700 16px var(--f-display);border:3px solid var(--ink);border-radius:12px;background:#FFF4CC;color:var(--ink);padding:6px 8px;min-height:42px}
.tog{appearance:none;-webkit-appearance:none;width:54px;height:32px;border-radius:999px;background:#C9CFDA;border:3px solid var(--ink);position:relative;cursor:pointer;flex:none;margin:0}
.tog::before{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#FFFFFF;border:2px solid var(--ink);transition:left .15s}
.tog:checked{background:var(--grn2)} .tog:checked::before{left:24px}
.dslide{border:3px solid var(--ink);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.dslide input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--sun1),var(--sun2)) 0 0/var(--p,0%) 100% no-repeat,#2B3140}
.ends{display:flex;justify-content:space-between;font:800 12.5px var(--f-body);color:#4A5163}

/* The report */
.tabs.big button{font-size:18px;padding:8px 16px;min-height:44px}
.headcard{display:flex;align-items:center;gap:14px;border:3px solid var(--ink);border-radius:20px;padding:12px 16px}
.headcard.up{background:#E8F9EF} .headcard.down{background:#FFE3DF}
.headcard b{font:700 clamp(20px,2.6vw,28px)/1.15 var(--f-display);display:block}
.headcard small{font:800 14.5px/1.35 var(--f-body);color:#3A4152;display:block}
.sum-two{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;align-items:start}
.bars-card, .card.side{background:#FFFFFF;border:3px solid var(--ink);border-radius:18px;padding:12px 14px}
.bars-card{display:flex;flex-direction:column;gap:8px}
.bars-card > b{font:700 18px var(--f-display)}
.bars{display:flex;gap:10px;height:150px;position:relative}
.bars::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed #B8BECB;pointer-events:none}
.bar{flex:1;position:relative}
.bar i{position:absolute;left:0;right:0;border:3px solid var(--ink);box-sizing:border-box}
.bar i.pos{bottom:50%;border-radius:8px 8px 0 0;background:linear-gradient(var(--grn1),var(--grn2))}
.bar i.neg{top:50%;border-radius:0 0 8px 8px;background:linear-gradient(var(--red1),var(--red2))}
.bar-l{display:flex;gap:10px}
.bar-l span{flex:1;text-align:center;font:800 12px var(--f-body);color:#4A5163}
.side-col{display:flex;flex-direction:column;gap:10px}
.card.side{display:flex;align-items:center;gap:12px}
.card.side b{font:700 17px var(--f-display);display:block}
.card.side small{font:800 13px var(--f-body);color:#4A5163;display:block}
.card.side.locked{background:repeating-linear-gradient(-45deg,#EEF1F6 0 12px,#E3E7EE 12px 24px);border-style:dashed}
.card.side.voices{flex-direction:column;align-items:flex-start;gap:2px}
.voices q{font:700 15px/1.3 var(--f-display)}
.why .card p{font:700 15px/1.4 var(--f-body);margin:0}
details.more summary{cursor:pointer;font:700 14px var(--f-display);color:var(--blu2)}
details.more .f{margin-top:6px}
.bm{font:700 13px var(--f-body);color:#4A5163;margin:4px 0 0}

/* Bank and investors */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.opt{text-align:left;background:#FFFFFF;border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);padding:10px 12px;display:flex;flex-direction:column;gap:2px;cursor:pointer;color:var(--ink);font:inherit}
.opt b{font:700 22px var(--f-display)} .opt span{font:800 13px var(--f-body);color:#4A5163}
.opt[aria-pressed="true"]{background:#E8F9EF;box-shadow:0 4px 0 var(--ink),0 0 0 4px var(--grn2)}
.opt:disabled{background:repeating-linear-gradient(-45deg,#EEF1F6 0 12px,#E3E7EE 12px 24px);border-style:dashed;box-shadow:none;cursor:default}
.pie{width:58px;height:58px;border-radius:50%;border:3px solid var(--ink);background:conic-gradient(var(--sun2) 0 var(--p), var(--pur2) var(--p) 100%);flex:none;box-sizing:border-box}
.pie.big{width:64px;height:64px}
.pie-tile{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center}
.pie-tile .pie{grid-row:1 / 3}
.offerbox{background:#FAF5FD;border:3px solid var(--ink);border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.offer-head{display:flex;align-items:center;gap:12px}
.offer-head b{font:700 24px/1.1 var(--f-display);display:block} .offer-head small{font:800 14px var(--f-body);color:#4A5163}
.offers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.offer{text-align:left;background:#FFFFFF;border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:12px;display:flex;flex-direction:column;gap:10px;cursor:pointer;font:inherit;color:var(--ink)}
.offer:hover{transform:translateY(-2px)}
.offer-top{display:flex;align-items:center;gap:12px}
.offer-top b{font:700 22px var(--f-display);display:block} .offer-top small{font:800 13px var(--f-body);color:#4A5163}

/* Business School */
.progress{display:flex;align-items:center;gap:12px}
.pbar{flex:1;max-width:320px;height:24px;border:3px solid var(--ink);border-radius:999px;background:var(--hud);overflow:hidden}
.pbar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,#4BE08A 0 12px,#2CC56C 12px 24px)}
.progress b{font:700 16px var(--f-display)}
.school{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:18px;align-items:start}
.school-list{display:flex;flex-direction:column;gap:8px}
.school .lessons{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lessons .ls.cur{background:#FFF4CC;box-shadow:0 4px 0 var(--ink),0 0 0 3px var(--sun2)} .lessons .ls.cur span{color:#6B4A00}
.school-read{display:flex;flex-direction:column;gap:12px;position:sticky;top:0}
.lesson.empty{align-items:center;text-align:center;padding:30px}
.lesson.empty b{font:700 22px var(--f-display)}
.lesson-two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lesson-two p{margin:2px 0 0;font:700 15px/1.45 var(--f-body)}
.ingame{background:#EAF4FF;border:3px solid var(--ink);border-radius:14px;padding:8px 10px}

/* Places */
.placegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.placegrid button{display:flex;flex-direction:column;align-items:center;gap:6px;background:#FFFFFF;border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:14px 10px;cursor:pointer;font:inherit;color:var(--ink);text-align:center}
.placegrid button:hover{transform:translateY(-2px)}
.placegrid b{font:700 18px/1.15 var(--f-display)} .placegrid span{font:800 13px var(--f-body);color:#4A5163}
.placegrid .locked{background:#EEF1F6;border-style:dashed;box-shadow:none}

/* Modals: start screen, news card, results */
.modal-box.k-event, .modal-box.k-result{padding:0;width:min(900px, 100%);gap:0}
.modal-box.k-setup{width:min(1240px, 100%)}
.modal-box.k-setup > h1{text-align:center;transform:rotate(-2deg);margin:4px 0 6px}
.mhead{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:4px solid var(--ink);border-radius:26px 26px 0 0;background:linear-gradient(color-mix(in srgb, var(--c) 55%, #FFFFFF), var(--c))}
.mhead > span.ol{font:700 24px var(--f-display)}
.mhead.center{flex-direction:column;gap:4px;padding:18px 22px 14px}
.mhead h2{font:700 44px/1 var(--f-display);margin:0}
.mhead .ol-sm{font:700 17px var(--f-display)}
.mbody{padding:18px 22px 22px;display:flex;flex-direction:column;gap:14px}
.ev-top{display:flex;align-items:center;gap:18px}
.ev-top .ico.huge svg{width:64%;height:64%}
.ev-top h2{font:700 clamp(24px,3.4vw,36px)/1.1 var(--f-display);margin:0}
.ev-top p{font:800 17px/1.4 var(--f-body);color:#3A4152;margin:4px 0 0}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.choice{text-align:left;background:#FFFFFF;border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;font:inherit;color:var(--ink)}
.choice:hover{transform:translateY(-2px)}
.ch-top{display:flex;align-items:center;gap:10px}
.ch-top > b{font:700 21px/1.15 var(--f-display)}
.choice > small{font:800 13px var(--f-body);color:#4A5163}
.cashline{display:flex;align-items:center;gap:10px;background:#FFFFFF;border:3px solid var(--ink);border-radius:16px;padding:8px 12px;font:800 16px var(--f-body)}
.medal{width:96px;height:96px;border-radius:50%;border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink),0 0 0 6px #FFFFFF,0 0 0 9px var(--ink);display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.medal.won{background:linear-gradient(var(--sun1),var(--sun2))} .medal.lost{background:linear-gradient(#C8D0DE,#8A94A8)}
.res-two{display:grid;grid-template-columns:1.1fr 1fr;gap:12px}
.teach{background:#FFF8DC;border:3px solid var(--ink);border-radius:18px;padding:12px 14px}
.teach p{font:700 18px/1.35 var(--f-display);margin:4px 0 0}
.cap{font:900 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:#4A5163}
.revisit{background:#FFFFFF;border:3px solid var(--ink);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.rv{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;cursor:pointer;font:inherit;color:var(--ink)}
.rv b{font:700 17px var(--f-display);display:block} .rv small{font:800 12.5px var(--f-body);color:#4A5163;display:block}
.rv .ico{width:38px;height:38px}
.setup{display:grid;grid-template-columns:minmax(0,500px) minmax(0,1fr);gap:24px}
.setup-col{display:flex;flex-direction:column;gap:12px}
.setup h3{font:700 22px var(--f-display);margin:0}
.bizgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bizc{text-align:left;background:#FFFFFF;border:4px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:0;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;color:var(--ink);font:inherit}
.bizc:hover{transform:translateY(-2px)}
.bizc-top{height:80px;display:flex;align-items:center;justify-content:center;border-bottom:3px solid var(--ink);background:linear-gradient(color-mix(in srgb, var(--c) 55%, #FFFFFF), var(--c))}
.bizc-b{padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.bizc-b b{font:700 20px/1.15 var(--f-display)}
.bizc[aria-pressed="true"]{background:#FFF8DC;box-shadow:0 6px 0 var(--ink),0 0 0 4px var(--sun2)}
.pips{display:flex;gap:4px} .pips i{width:20px;height:8px;border-radius:4px;border:2px solid var(--ink);background:#E3E7EE} .pips i.on{background:var(--grn2)}
.lvpath{position:relative;display:flex;justify-content:space-between;align-items:flex-start;padding-top:6px}
.lvpath .track{position:absolute;left:40px;right:40px;top:40px;height:10px;border:3px solid var(--ink);border-radius:999px;background:#E3E7EE;overflow:hidden}
.lvpath .track i{display:block;height:100%;background:var(--grn2)}
.lvn{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer;width:86px;font:inherit;color:var(--ink)}
.lvn .dot{width:70px;height:70px;border-radius:50%;border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);display:flex;align-items:center;justify-content:center;background:linear-gradient(#FFFFFF,#DDE3EE);box-sizing:border-box}
.lvn .dot .ol{font:700 26px var(--f-display)}
.lvn:not(.cur):not(.done) .dot .ol{color:var(--ink);text-shadow:none}
.lvn.done .dot{background:linear-gradient(var(--grn1),var(--grn2))}
.lvn.cur .dot{background:linear-gradient(var(--sun1),var(--sun2));box-shadow:0 5px 0 var(--ink),0 0 0 5px #FFFFFF,0 0 0 8px var(--ink);transform:scale(1.08)}
.lvn.lock{cursor:default;color:#4A5163} .lvn.lock .dot{background:#E3E7EE;box-shadow:none}
.lvn .nm{font:700 15px/1.15 var(--f-display);text-align:center}
.story{background:#FFFFFF;border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.story > b{font:700 26px/1.1 var(--f-display)}
.story p{font:800 15.5px/1.4 var(--f-body);color:#3A4152;margin:0}
.diffbtn{display:inline-flex;flex-direction:column;align-items:center;gap:0;font:700 18px var(--f-display)}
.diffbtn small{font:800 11px var(--f-body);color:#4A5163}

/* The Run dock (bottom right in town) */
.rundock{position:fixed;right:max(18px, env(safe-area-inset-right, 0px));bottom:calc(env(safe-area-inset-bottom, 0px) + 18px);width:min(330px, calc(100% - 36px));display:flex;flex-direction:column;gap:10px;z-index:6}
.plan{background:#FFFFFF;border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.plan-h{display:flex;justify-content:space-between;align-items:center}
.plan-h b{font:700 17px var(--f-display)}
.plan-h button{background:none;border:0;font:800 14px var(--f-body);color:var(--blu2);cursor:pointer;text-decoration:underline;padding:4px}
.runbtn{display:flex;align-items:center;gap:14px;background:linear-gradient(var(--grn1),var(--grn2));border:3px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--ink);padding:10px 16px;cursor:pointer;text-align:left}
.runbtn:hover{transform:translateY(-1px)} .runbtn:active{transform:translateY(4px);box-shadow:0 3px 0 var(--ink)}
.rb-ic{width:46px;height:46px;border-radius:14px;background:#FFFFFF;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.rb-ic svg path{fill:var(--grn2)}
.runbtn .ol{font:700 27px/1.05 var(--f-display)}
body.panel-open .rundock{display:none}

@media (max-width:860px){
  .tiles.four{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sum-two, .res-two, .offers, .notes, .lesson-two, .setup{grid-template-columns:1fr}
  .school{grid-template-columns:1fr}
  .school.has-lesson .school-list{display:none}
  .school:not(.has-lesson) .school-read{display:none}
}
@media (max-width:700px){
  .plan{display:none}
  .rundock{width:auto;bottom:calc(env(safe-area-inset-bottom, 0px) + 84px)}
  .runbtn{padding:8px 12px;gap:10px} .runbtn .ol{font-size:19px} .rb-ic{width:34px;height:34px;border-radius:10px}
  .placegrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .drow{flex-wrap:wrap}
  .lvn{width:50px} .lvn .dot{width:44px;height:44px;border-width:3px} .lvn .dot .ol{font-size:17px} .lvn .nm{font-size:10.5px}
  .lvpath .track{left:22px;right:22px;top:26px}
  .ev-top .ico.huge{width:72px;height:72px;border-radius:20px}
  .mhead h2{font-size:34px}
  .modal-box.k-setup > h1{font-size:40px}
  .bizc-top{height:56px} .bizc-top svg{width:38px;height:38px}
}

/* Fixes after the first test run */
.ico.ink svg{stroke:#9AA3B5}
.lvn{width:96px} .lvn .nm{white-space:nowrap;font-size:14px}
.pie-tile b{white-space:nowrap}
body.modal-open .rundock{display:none}
@media (max-width:700px){ .lvn .nm{display:none} .lvn{width:46px} }
</style>

  lessons: {"micro":{"idea":"How people decide what to buy. Raise a price and fewer buy; how many fewer depends on how much they want it.","formula":"elasticity = % change in sales ÷ % change in price","example":"Coffee $4.00 → $4.40 (+10%), sales 200 → 170 (−15%). Revenue falls from $800 to $748.","tip":"Change prices in small steps and watch revenue."},"macro":{"idea":"The whole economy: growth, recessions, inflation, interest rates. You can't control it, but it moves your sales and costs.","formula":"real growth ≈ sales growth − inflation","example":"Sales up 6% while prices everywhere rose 4%: you really sold about 2% more.","tip":"In a slowdown, protect cash. Don't panic-cut prices."},"game":{"idea":"When your result depends on a rival's move too. If you both keep cutting prices, you both lose.","formula":"best move = best result, given what they'll do back","example":"You cut 20%, the rival matches. Same customers as before, less money for both.","tip":"Compete on what they can't copy fast: quality and service."},"finacct":{"idea":"Three standard reports: profit (income statement), what you own and owe (balance sheet), and where cash went (cash flow).","formula":"assets = liabilities + equity","example":"$12k cash + $8k equipment = $20k owned. Owe the bank $5k → $15k is the owners'.","tip":"Profit up but cash down? Check the cash flow tab."},"mgmtacct":{"idea":"Numbers for decisions inside the business: what things really cost, and which costs grow with sales.","formula":"cost share = cost ÷ sales","example":"Sales $20k, ingredients $8k = 40%. The usual is 25–35%, so look for waste.","tip":"A cost growing faster than sales is the first thing to fix."},"markets":{"idea":"Where money is lent and invested: banks, bonds and stock markets. Their rates set what money costs you.","formula":"yearly interest = amount borrowed × rate","example":"$25,000 at 10% costs about $2,500 a year, around $208 a month.","tip":"Borrow when the money earns more than its interest."},"corpfin":{"idea":"How a business pays for itself and its growth: its own profits, loans, or selling a share.","formula":"payment = loan × r ÷ (1 − (1 + r)^−months)","example":"$50,000 at 10% over 3 years ≈ $1,613 a month. Only the interest part is a cost.","tip":"Make sure repayments fit inside your monthly profit."},"valuation":{"idea":"What a business is worth. Small firms often sell for a few times their yearly profit.","formula":"value ≈ multiple × yearly profit + cash − debt","example":"$40,000 profit × 2.2 = $88,000, + $10k cash − $15k loan = $83,000.","tip":"Steady profit raises your value more than one big month."},"fund":{"idea":"Selling part of your company for cash. The terms decide the price and who gets paid first.","formula":"their share = investment ÷ (value before + investment)","example":"$50,000 in at a $150,000 value → they own 25%.","tip":"Watch for 2× terms: they get twice their money back first."},"excel":{"idea":"Model the business in numbers, then change one to see what happens to profit.","formula":"profit = (price − cost) × sales − fixed costs","example":"($5 − $2) × 1,200 − $3,000 = $600. At 1,000 sales: $0.","tip":"Do the rough sum before you run the month."},"unitecon":{"idea":"The profit on one sale, and how many sales it takes to cover your fixed costs.","formula":"break-even = fixed costs ÷ (price − cost per sale)","example":"$9,000 rent and wages ÷ $3 profit a coffee = 3,000 a month, about 100 a day.","tip":"Can't serve that many? Change price, costs or staff first."},"budget":{"idea":"Planning money ahead. Runway is how many months your cash lasts at the current loss.","formula":"runway = cash ÷ monthly loss","example":"$18,000 cash, losing $4,500 a month → 4 months to turn it around.","tip":"Keep at least 3 months of runway."},"fsa":{"idea":"Reading the statements to judge health: is it profitable, does profit turn into cash, can it pay its bills?","formula":"cash change = profit − more owed to you − more stock + more you owe","example":"Profit $6,000, but clients owe $9,000 more: cash falls $3,000.","tip":"Read profit and cash together."},"marketing":{"idea":"Getting the right customers to find you, want you and come back.","formula":"return on ads = sales from ads ÷ ad cost","example":"$1,000 of ads → $3,500 sales. At a 40% margin that's $1,400 profit: worth it.","tip":"Spend more only while it pays back."},"pricing":{"idea":"Setting prices on what customers value, not just on your costs.","formula":"margin = (price − cost) ÷ price","example":"40 hours at $50 = $2,000. Worth $5,000 to the client? A $3,500 fixed price earns more.","tip":"Always full? Your price is probably too low."},"sales":{"idea":"Selling it yourself early on: finding first customers, listening, closing deals.","formula":"sales = leads × win rate × average deal","example":"40 leads × 1 in 5 × $3,000 = $24,000.","tip":"Talk to customers in town. They tell you what to fix."},"strategy":{"idea":"Choosing where to compete and how to win: what you will and won't do.","formula":"","example":"One café is cheapest, the other has the best coffee and seats to work. Both can win.","tip":"Scout your rival, then serve who they serve badly."},"ops":{"idea":"Running the daily work: how much you can serve, how fast, at what cost.","formula":"utilisation = time used ÷ time available","example":"2 baristas serve 160 a day. 200 come → 40 leave. 80 come → half the wages wasted.","tip":"Match staff and stock to demand."},"innov":{"idea":"Finding, testing and launching new ideas while the business keeps running.","formula":"","example":"Developers build a new feature: slower for a while, then customers a rival can't reach.","tip":"Try new things in small, affordable steps."},"lead":{"idea":"Getting the best from people: hire well, set clear goals, keep workloads fair.","formula":"wage share = wages ÷ sales","example":"$12k wages on $20k sales = 60%. Lose a quarter of the work and it can't pay.","tip":"Hire after several busy months, not one."},"nego":{"idea":"Reaching a deal when both sides want something. Trade what's cheap for you but valuable to them.","formula":"","example":"Client wants 20% off. Offer 10% off for a longer contract paid upfront.","tip":"On news cards, give up time or terms before cash."},"law":{"idea":"Contracts make deals enforceable: who does what, by when, and what if they don't.","formula":"","example":"A client won't pay for extra changes. Your contract charges them by the hour, so the bill stands.","tip":"Cheap choices now can bring a bill later."},"discovery":{"idea":"Finding out what customers really need before you build or sell much.","formula":"","example":"Office workers say they've no time to queue. Fast ordering beats a cheaper sandwich.","tip":"Ask customers in town. It's real information."},"bizmodel":{"idea":"How a business makes money: who pays, for what, and how often.","formula":"profit = revenue − costs","example":"A café earns a little from many people daily. Software earns a monthly fee for years.","tip":"Play all four businesses to see the difference."},"launch":{"idea":"Getting from idea to paying customers with little money. Start small, test, grow what works.","formula":"months to survive = starting cash ÷ monthly loss","example":"$20,000 to start, losing $3,000 a month → about 6 months to break even.","tip":"If it can't work on paper, it won't work in the game."},"product":{"idea":"Building what customers use and value. A disappointing product loses people, whatever the marketing.","formula":"","example":"Customers leave over one missing feature. Building it beats winning sign-ups who'd also leave.","tip":"Many cancelling? Fix the product before more ads."},"saas":{"idea":"Subscription numbers: monthly revenue (MRR), cancellations (churn), and what a customer is worth vs what they cost to win.","formula":"LTV = monthly profit ÷ churn; aim for LTV ≥ 3 × CAC","example":"$25 profit a month ÷ 5% churn = $500 LTV. Winning one costs $150: healthy.","tip":"Lower churn raises LTV the most."},"growth":{"idea":"Winning customers efficiently: find what works, measure the cost, spend where it pays.","formula":"CAC = marketing spend ÷ new customers","example":"$4,000 of ads → 50 customers = $80 each. $60 profit a month pays it back within 2 months.","tip":"Raise marketing in steps and watch the cost per customer."}},
